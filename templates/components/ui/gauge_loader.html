{# RevUp UI kit: gauge loader overlay. Include once per page; call uiloadShow('msg') on long submits. #}
<div class="ruk-load-overlay" id="rukLoad">
<svg class="ruk-gauge" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
<g class="ruk-ring-rotate"><circle class="ruk-ring-stroke" cx="80" cy="80" r="72" fill="none" stroke="#F97316" stroke-width="16" stroke-dasharray="452.39 452.39" stroke-dashoffset="452" stroke-linecap="round" transform="rotate(-45,80,80)"/></g>
<g stroke-width="4" stroke-dasharray="12 12" stroke-dashoffset="12" stroke-linecap="round" transform="translate(80,80)">
<polyline class="ruk-tick" stroke="#FDBA74" points="0,2 0,14" transform="rotate(-135,0,0) translate(0,40)"/><polyline class="ruk-tick" stroke="#FDBA74" points="0,2 0,14" transform="rotate(-90,0,0) translate(0,40)"/><polyline class="ruk-tick" stroke="#FDBA74" points="0,2 0,14" transform="rotate(-45,0,0) translate(0,40)"/><polyline class="ruk-tick" stroke="#FDBA74" points="0,2 0,14" transform="rotate(0,0,0) translate(0,40)"/><polyline class="ruk-tick" stroke="#FDBA74" points="0,2 0,14" transform="rotate(45,0,0) translate(0,40)"/><polyline class="ruk-tick" stroke="#FDBA74" points="0,2 0,14" transform="rotate(90,0,0) translate(0,40)"/><polyline class="ruk-tick" stroke="#FDBA74" points="0,2 0,14" transform="rotate(135,0,0) translate(0,40)"/><polyline class="ruk-tick" stroke="#FDBA74" points="0,2 0,14" transform="rotate(180,0,0) translate(0,40)"/>
</g></svg>
<p id="rukLoadMsg">Working...</p></div>
<style>.ruk-load-overlay{position:fixed;inset:0;background:rgba(250,250,249,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:100;text-align:center}.ruk-load-overlay.on{display:flex}.ruk-load-overlay p{font-weight:600;color:#44403C;margin-top:14px}</style>
<script>function uiloadShow(m){var o=document.getElementById('rukLoad');if(m)document.getElementById('rukLoadMsg').textContent=m;o.classList.add('on')}</script>
