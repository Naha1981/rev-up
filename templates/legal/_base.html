{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Legal - RevUp{% endblock %}</title>
<link rel="icon" href="{% static 'favicon/favicon.ico' %}" sizes="any">
<link rel="icon" type="image/svg+xml" href="{% static 'favicon/favicon.svg' %}">
<style>
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1C1917;line-height:1.7;margin:0;background:#FAFAF9}
.wrap{max-width:760px;margin:0 auto;padding:32px 24px 64px}
a{color:#EA580C}
.logo{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-size:20px;font-weight:700;color:#1C1917;text-decoration:none;margin-bottom:32px}
.logo-mark{width:30px;height:30px;border-radius:9px;background:#F97316;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
h1{font-family:Georgia,serif;font-size:32px;margin-bottom:6px;letter-spacing:-0.3px}
.updated{color:#78716C;font-size:13.5px;margin-bottom:32px}
h2{font-size:19px;margin:30px 0 8px}
p,li{font-size:15px;color:#44403C}
ul,ol{padding-left:22px;margin:8px 0}
.card{background:#fff;border:1px solid #E7E5E4;border-radius:14px;padding:8px 28px 20px}
footer{margin-top:40px;font-size:13px;color:#A8A29E;border-top:1px solid #E7E5E4;padding-top:20px}
footer a{color:#57534E;text-decoration:none;margin-right:18px}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="/"><span class="logo-mark">R</span>RevUp</a>
  <div class="card">
  {% block content %}{% endblock %}
  </div>
  <footer>
    <a href="/">RevUp home</a>
    <a href="/legal/terms/">Terms of Service</a>
    <a href="/legal/privacy/">Privacy Policy</a>
    <a href="mailto:sales@nahalabs.co.za">sales@nahalabs.co.za</a>
  </footer>
</div>
</body>
</html>
