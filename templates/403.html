{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>No access to this workspace · RevUp</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: #FAFAF9;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(249,115,22,0.08), transparent),
                radial-gradient(ellipse 60% 40% at 100% 100%, rgba(20,184,166,0.04), transparent);
        }
        .card {
            width: 100%;
            max-width: 28rem;
            background: #FFFFFF;
            border: 1px solid #E7E5E4;
            border-radius: 0.75rem;
            box-shadow: 0 1px 2px rgba(28,25,23,0.05);
            padding: 2rem;
            text-align: center;
        }
        .brand {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #F97316;
            margin: 1rem 0 0.5rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #1C1917;
            margin: 0 0 0.5rem;
        }
        p {
            font-size: 0.875rem;
            color: #57534E;
            margin: 0 0 1.75rem;
        }
        .btn-brand {
            display: inline-block;
            background-color: #F97316;
            color: #FFFFFF;
            font-size: 0.875rem;
            font-weight: 600;
            text-decoration: none;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 14px rgba(147,162,64,0.28);
        }
        .btn-brand:hover { background-color: #EA580C; }
        .logo { width: 3rem; height: 3rem; object-fit: contain; }
    </style>
</head>
<body>
    <div class="card">
        <img src="{% static 'brand/revup-light.png' %}" alt="RevUp logo" class="logo">
        <span class="brand">RevUp</span>
        <h1>You don't have access to this workspace</h1>
        <p>This workspace belongs to another account. If you were invited, ask the workspace owner to check your invitation.</p>
        <a class="btn-brand" href="/">Go to my workspace</a>
    </div>
</body>
</html>
