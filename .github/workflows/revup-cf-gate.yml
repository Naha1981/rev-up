name: RevUp CF release gate

# Safe-release gate for the Cloudflare Worker front door (workers/revup-cf).
# Runs the worker unit suite, builds the exact deploy artifact (wrangler
# --dry-run, no upload), and creates + verifies a release manifest bound to
# the full commit and artifact hash (tools/safe-release/release_gate.py).
# PLAN_ONLY: this workflow never deploys. Live deploys stay manual wrangler
# and need the owner's explicit Go + Sure each time.

on:
  push:
    branches: [main, review/design-home-only, review/role-hotfix, review/customer-safety, review/workflow-safety, review/campaign-safety, review/entitlement-safety, review/social-handoff-safety, review/opportunity-safety, review/social-writer-safety, review/numeric-safety, review/waitlist-safety, review/phone-table-safety, review/lead-money-safety, "review/p0-*"]
    paths: ["workers/revup-cf/**", "tools/safe-release/**", ".github/workflows/revup-cf-gate.yml"]
  pull_request:
    branches: [main, "review/**"]
    paths: ["workers/revup-cf/**", "tools/safe-release/**", ".github/workflows/revup-cf-gate.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ github.event.repository.private && 'BLOCKED_PRIVATE_REQUIRES_COST_APPROVAL' || 'Unit tests + manifest gate' }}
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Official postgres18.6 multi-platform digest, verified11Nov2026.
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: sandbox
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55431:5432
        options: >-
          --health-cmd "pg_isready -U sandbox -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22

      - name: Test release verifier and evidence transport
        working-directory: tools/safe-release
        run: python3 -m unittest -v

      - name: Install worker deps
        working-directory: workers/revup-cf
        run: npm ci

      - name: Worker whole-source TypeScript check
        working-directory: workers/revup-cf
        run: npm run typecheck

      - name: Production dependency advisory scan
        working-directory: workers/revup-cf
        run: npm run audit:prod

      - name: "Run worker unit suite (evidence: JUnit XML + raw TAP)"
        working-directory: workers/revup-cf
        run: |
          mkdir -p "$RUNNER_TEMP/gate"
          npm run build:test --silent
          node --test --test-reporter=junit test/worker.test.mjs test/freeai.test.mjs test/priceguard.test.mjs test/factrules.test.mjs test/assistant.test.mjs test/socialteam.test.mjs test/chatapp.test.mjs test/menu.test.mjs test/connect-errors.test.mjs test/tenant-crypto.test.mjs test/permissions.test.mjs test/customer-safety.test.mjs test/workflow-safety.test.mjs test/campaign-safety.test.mjs test/entitlement-safety.test.mjs test/social-handoff-safety.test.mjs test/opportunity-safety.test.mjs test/social-writer-safety.test.mjs test/numeric-safety.test.mjs test/waitlist-safety.test.mjs test/phone-table-safety.test.mjs test/lead-money-safety.test.mjs test/industry-specialists.test.mjs test/messaging-safety.test.mjs test/ingress-response.test.mjs test/staging-worker.test.mjs test/runtime-proof.test.mjs > "$RUNNER_TEMP/gate/unit.xml"
          node --test test/worker.test.mjs test/freeai.test.mjs test/priceguard.test.mjs test/factrules.test.mjs test/assistant.test.mjs test/socialteam.test.mjs test/chatapp.test.mjs test/menu.test.mjs test/connect-errors.test.mjs test/tenant-crypto.test.mjs test/permissions.test.mjs test/customer-safety.test.mjs test/workflow-safety.test.mjs test/campaign-safety.test.mjs test/entitlement-safety.test.mjs test/social-handoff-safety.test.mjs test/opportunity-safety.test.mjs test/social-writer-safety.test.mjs test/numeric-safety.test.mjs test/waitlist-safety.test.mjs test/phone-table-safety.test.mjs test/lead-money-safety.test.mjs test/industry-specialists.test.mjs test/messaging-safety.test.mjs test/ingress-response.test.mjs test/staging-worker.test.mjs test/runtime-proof.test.mjs | tee "$RUNNER_TEMP/gate/worker-unit.tap"
          grep -q "^# fail 0" "$RUNNER_TEMP/gate/worker-unit.tap"

      - name: Synthetic PostgreSQL safety suite (no production credentials)
        working-directory: workers/revup-cf
        run: |
          node --test --test-reporter=junit test/messaging-safety-db.test.mjs > "$RUNNER_TEMP/gate/db.xml"
          node --test test/messaging-safety-db.test.mjs | tee "$RUNNER_TEMP/gate/db.tap"
          grep -q "^# fail 0" "$RUNNER_TEMP/gate/db.tap"

      - name: Build deploy artifact (dry-run, no upload)
        working-directory: workers/revup-cf
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/gate/raw-build"
          python3 ../../tools/safe-release/deploy_payload.py --build "$RUNNER_TEMP/gate/raw-build" --output "$RUNNER_TEMP/gate/candidate"

      - name: Create and verify release manifest
        run: |
          set -euo pipefail
          G="$RUNNER_TEMP/gate"
          ART=$(python3 tools/safe-release/release_gate.py artifact-digest --artifact "$G/candidate" | jq -r .artifact_sha256)
          python3 tools/safe-release/junit_collect.py \
            --junit "$G/unit.xml" \
            --expected-cases tools/safe-release/reviewed-unit-cases.json \
            --check worker-unit --commit "${{ github.sha }}" \
            --artifact-sha256 "$ART" --evidence-reference unit.xml \
            --output "$G/worker-unit-check.json"
          python3 tools/safe-release/junit_collect.py \
            --junit "$G/db.xml" \
            --expected-cases tools/safe-release/reviewed-db-cases.json \
            --check worker-db --commit "${{ github.sha }}" \
            --artifact-sha256 "$ART" --evidence-reference db.xml \
            --output "$G/worker-db-check.json"
          jq -s '.' "$G/worker-unit-check.json" "$G/worker-db-check.json" > "$G/checks.json"
          python3 tools/safe-release/release_gate.py manifest \
            --policy tools/safe-release/policy.json --checks "$G/checks.json" \
            --artifact "$G/candidate" --commit "${{ github.sha }}" \
            --rollback tools/safe-release/rollback.json --output "$G/release.json" \
            --evidence-root "$G"
          python3 tools/safe-release/release_gate.py verify \
            --policy tools/safe-release/policy.json --manifest "$G/release.json" --artifact "$G/candidate" \
            --evidence-root "$G"
          jq -r '"manifest_sha256: \(.manifest_sha256)"' "$G/release.json"

      - name: Preserve bounded byte-exact evidence even after failure
        if: always()
        run: python3 tools/safe-release/hosted_gate.py emit --root "$RUNNER_TEMP/gate"
