name = "revup-cf"
main = "src/worker.ts"
compatibility_date = "2026-11-03"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

[[routes]]
pattern = "revup-new.nahalabs.co.za"
custom_domain = true


[[routes]]
pattern = "revup.nahalabs.co.za"
custom_domain = true

[triggers]
crons = ["*/15 * * * *"]

[vars]
# his "Yes data" approval (7 Nov 01:09) wired in as flags: the enquiry-text backup
# runs only while both are true; remove either to switch the backup off without a deploy
OPENROUTER_FREE_ONLY = "true"
OPENROUTER_DATA_USE_APPROVED = "true"
