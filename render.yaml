services:
  - type: web
    name: brightbean-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    preDeployCommand: "python manage.py migrate"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY_SALT
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: brightbean-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: STORAGE_BACKEND
        value: s3

  - type: worker
    name: brightbean-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python manage.py run_studio_worker
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: brightbean-web
          type: web
          envVarKey: SECRET_KEY
      - key: ENCRYPTION_KEY_SALT
        fromService:
          name: brightbean-web
          type: web
          envVarKey: ENCRYPTION_KEY_SALT
      - key: DATABASE_URL
        fromDatabase:
          name: brightbean-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: s3

databases:
  - name: brightbean-db
    plan: free
  - type: web
    name: nahalabs-responder
    runtime: node
    plan: free
    buildCommand: cd modules/responder && npm ci && npm run build
    startCommand: cd modules/responder && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # WHATSAPP_MODE stays unset = dry-run. Live sends need the owner's explicit go.
      # DATABASE_URL / WA_CLOUD_* / EVOLUTION_* / GOOGLE_* added in the dashboard
      # when each stage is approved to go live. See modules/responder/.env.example.
